name: wego-hatchet

x-environment: &environment
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
  DATABASE_MAX_CONNS: "20"
  SERVER_MSGQUEUE_KIND: postgres
  SERVER_OBSERVABILITY_ENABLED: "true"
  SERVER_SECURITY_CHECK_ENABLED: "false"
  SERVER_URL: http://localhost:${HATCHET_HTTP_PORT:-8080}
  SERVER_AUTH_COOKIE_DOMAIN: localhost
  SERVER_AUTH_COOKIE_INSECURE: "true"
  SERVER_GRPC_BIND_ADDRESS: 0.0.0.0
  SERVER_GRPC_PORT: "7070"
  SERVER_GRPC_INSECURE: "true"
  SERVER_GRPC_BROADCAST_ADDRESS: localhost:${HATCHET_GRPC_PORT:-7077}
  SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: hatchet-engine:7070

services:
  extra-init:
    # 仅初始化阶段读取 Hatchet 加密配置；运行容器不挂载 JWT 私钥。
    image: hatchet-extra:local
    build:
      context: ../../../..
      dockerfile: cmd/hatchet-extra/Dockerfile
    user: "0:0"
    command: ["init"]
    environment:
      SERVER_SECURITY_CHECK_ENABLED: "false"
    volumes:
      - hatchet_config:/hatchet/config:ro
      - extra_config:/extra-config
      - extra_data:/data
    depends_on:
      setup-config:
        condition: service_completed_successfully

  hatchet-extra:
    image: hatchet-extra:local
    build:
      context: ../../../..
      dockerfile: cmd/hatchet-extra/Dockerfile
    command:
      - --listen=0.0.0.0:7080
      - --store=/data
      - --jwt-public-key=/extra-config/jwt-public.key
      - --tls-cert=/extra-config/tls.crt
      - --tls-key=/extra-config/tls.key
      - --shutdown-timeout=30s
      - --max-fetch-messages=100
      - --max-publish-batch-messages=100
      - --max-publish-batch-bytes=4194304
      - --max-concurrent-unary=128
      - --max-concurrent-streams=1024
      - --max-concurrent-reads=64
      - --max-publish-batches-inflight=32
      - --batch-commit-timeout=8s
      - --batch-abandon-timeout=10s
      - --publish-batch-flow-control=16
      - --max-consumers=10000
      - --max-ack-batch-messages=100
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      DATABASE_MAX_CONNS: "5"
      SERVER_URL: http://localhost:${HATCHET_HTTP_PORT:-8080}
      SERVER_SECURITY_CHECK_ENABLED: "false"
    ports:
      - "127.0.0.1:${EXTRA_GRPC_PORT:-7080}:7080"
    volumes:
      - extra_config:/extra-config:ro
      - extra_data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "hatchet-extra", "healthcheck", "--ca=/extra-config/tls.crt"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      extra-init:
        condition: service_completed_successfully

  minio:
    # 从官方发布源码构建；社区版的最新正式发布不提供预编译容器。
    image: wego-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: .
      dockerfile: minio.Dockerfile
    command: ["server", "/data", "--console-address", ":9001"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-12345678}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  migration:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-migrate:v0.110.5
    command: /hatchet/hatchet-migrate
    environment: *environment

  setup-config:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-admin:v0.110.5
    command: /hatchet/hatchet-admin quickstart --skip certs --generated-config-dir /hatchet/config --overwrite=false
    environment: *environment
    volumes:
      - hatchet_config:/hatchet/config
    depends_on:
      migration:
        condition: service_completed_successfully

  hatchet-engine:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-engine:v0.110.5
    command: /hatchet/hatchet-engine --config /hatchet/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8733/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    environment:
      <<: *environment
      SERVER_OTEL_COLLECTOR_URL: host.docker.internal:4317
      SERVER_OTEL_SERVICE_NAME: hatchet-engine
      SERVER_OTEL_INSECURE: "true"
      SERVER_OTEL_TRACE_ID_RATIO: "1"
      SERVER_OTEL_METRICS_ENABLED: "false"
    ports:
      - "127.0.0.1:${HATCHET_GRPC_PORT:-7077}:7070"
    volumes:
      - hatchet_config:/hatchet/config
    depends_on:
      setup-config:
        condition: service_completed_successfully

  hatchet-dashboard:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-dashboard:v0.110.5
    command: sh ./entrypoint.sh --config /hatchet/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    environment:
      <<: *environment
      SERVER_OTEL_COLLECTOR_URL: host.docker.internal:4317
      SERVER_OTEL_SERVICE_NAME: hatchet-api
      SERVER_OTEL_INSECURE: "true"
      SERVER_OTEL_TRACE_ID_RATIO: "1"
      SERVER_OTEL_METRICS_ENABLED: "false"
    ports:
      - "127.0.0.1:${HATCHET_HTTP_PORT:-8080}:80"
    volumes:
      - hatchet_config:/hatchet/config
    depends_on:
      setup-config:
        condition: service_completed_successfully

volumes:
  hatchet_config:
  minio_data:
  extra_config:
  extra_data:
