// 完整 protobuf 协议帧统一经过 codec；业务 payload 使用 ProtoJSON
syntax = "proto3";
package wego.wire.v1;
option go_package = "github.com/hatchet-dev/hatchet/sdks/wego/internal/wire";

// Values 保留同名 metadata 的多个值，不能以单个字符串覆盖
message Values {
  // values 保存原始字节；token-bin 的 ff00fe 不受 UTF-8 string 限制
  repeated bytes values = 1;
}

// LogFrame 是协议 4 的持久日志帧；完整帧序列化后统一经过 codec
// CLAIM 与 DATA 均包含执行身份，解码成功后才解释代次和输出序号
message LogFrame {
  // version 固定为 4，不能与会话协议混用
  uint32 version = 1;
  // kind 为 CLAIM、HEADERS、DATA、ATTEMPT_END、JOIN、EVENT 或 CANCEL
  string kind = 2;
  // task_run_id 是本日志关联的任务身份，事件 topic 可为空
  string task_run_id = 3;
  // run_id 是管理入口的运行身份，不假定与 task_run_id 相等
  string run_id = 4;
  // method 是完整 RPC 方法名，用于恢复身份校验
  string method = 5;
  // epoch 使用官方 RetryCount，不能由本地计数代替
  int32 epoch = 6;
  // writer 是本次物理执行的随机 nonce
  string writer = 7;
  // worker_key 是通知地址，不参与展示名称
  string worker_key = 8;
  // output_seq 是跨代次连续的业务序号；非 DATA 帧可为零
  uint64 output_seq = 9;
  // payload 保存业务 ProtoJSON 或事件数据，不单独执行第二次 codec
  bytes payload = 10;
  // metadata 保存多值 headers，沿用二进制 metadata 表示
  map<string, Values> metadata = 11;
  // trailers 保存当前 attempt 的最终尾部 metadata
  map<string, Values> trailers = 12;
  // status 保存 google.rpc.Status 的 protobuf 编码
  bytes status = 13;
  // frame_id 关联结束清单或启动屏障，发布重试保持相同值
  string frame_id = 14;
  // input_digest 检测同一个幂等键是否误用于不同输入
  string input_digest = 15;
  // expires_at 使用 Unix 纳秒，为事件和内部通知提供有效期
  int64 expires_at = 16;
  // old_epoch 与 old_writer 限定取消通知的旧执行目标
  int32 old_epoch = 17;
  // old_writer 只取消匹配旧 nonce 的执行，不能取消接管后的新 writer
  string old_writer = 18;
}

// EncodedLogFrame 为 codec 解码提供引导信息，不暴露内部执行字段
message EncodedLogFrame {
  // format_version 标识此引导封装的格式，目前为 1
  uint32 format_version = 1;
  // codec_ids 按 Encode 顺序保存稳定版本标识，接收方必须有相同解码链
  repeated string codec_ids = 2;
  // payload 为整帧的 codec 输出，允许是密文或对象引用
  bytes payload = 3;
}
