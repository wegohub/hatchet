name: wego-ci
x-environment: &environment
  DATABASE_URL: postgres://root:123456@postgres:5432/hatchet?sslmode=disable
  SERVER_MSGQUEUE_KIND: postgres
  SERVER_SECURITY_CHECK_ENABLED: "false"
  SERVER_OBSERVABILITY_ENABLED: "true"
  SERVER_URL: http://localhost:8080
  SERVER_AUTH_COOKIE_DOMAIN: localhost
  SERVER_AUTH_COOKIE_INSECURE: "true"
  SERVER_GRPC_BIND_ADDRESS: 0.0.0.0
  SERVER_GRPC_PORT: "7070"
  SERVER_GRPC_INSECURE: "true"
  SERVER_GRPC_BROADCAST_ADDRESS: localhost:7077
  SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: engine:7070
  SERVER_OTEL_COLLECTOR_URL: jaeger:4317
  SERVER_OTEL_SERVICE_NAME: hatchet-ci
  SERVER_OTEL_INSECURE: "true"
  SERVER_OTEL_TRACE_ID_RATIO: "1"
  SERVER_OTEL_METRICS_ENABLED: "false"
services:
  minio:
    image: wego-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: ../deployment/compose
      dockerfile: minio.Dockerfile
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: codec-fixture
      MINIO_ROOT_PASSWORD: codec-fixture-secret
    ports: ["127.0.0.1:9000:9000"]
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 3s
      timeout: 2s
      retries: 30
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: hatchet
      TZ: UTC
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d hatchet"]
      interval: 2s
      timeout: 2s
      retries: 30
  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports: ["127.0.0.1:4317:4317", "127.0.0.1:16686:16686"]
  migration:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-migrate:v0.110.5
    command: /hatchet/hatchet-migrate
    environment: *environment
    depends_on:
      postgres: {condition: service_healthy}
  setup:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-admin:v0.110.5
    command: /hatchet/hatchet-admin quickstart --skip certs --generated-config-dir /hatchet/config
    environment: *environment
    volumes: ["config:/hatchet/config"]
    depends_on:
      migration: {condition: service_completed_successfully}
  engine:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-engine:v0.110.5
    command: /hatchet/hatchet-engine --config /hatchet/config
    environment: *environment
    ports: ["127.0.0.1:7077:7070"]
    volumes: ["config:/hatchet/config"]
    depends_on:
      setup: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8733/ready"]
      interval: 5s
      timeout: 3s
      retries: 24
  api:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-dashboard:v0.110.5
    command: sh ./entrypoint.sh --config /hatchet/config
    environment: *environment
    ports: ["127.0.0.1:8080:80"]
    volumes: ["config:/hatchet/config"]
    depends_on:
      setup: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/ready"]
      interval: 5s
      timeout: 3s
      retries: 24
  token:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-admin:v0.110.5
    command: /hatchet/hatchet-admin --config /hatchet/config token create --name ci --expiresIn 2h
    environment: *environment
    profiles: [tools]
    volumes: ["config:/hatchet/config"]
volumes:
  config:
  minio_data:
